[project]
name = "langchain-study"
version = "0.1.0"
description = "LangChain 1.2 分模块学习项目"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.2.12",
    "langchain-core==1.2.18",
    "langgraph==1.1.2",
    "langchain-text-splitters==1.1.1",
    "python-dotenv==1.2.1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
provider = ["langchain-openai>=1.1,<2"]
rag = ["langchain-community>=0.4,<1", "pypdf>=5,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
